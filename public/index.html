<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Chat</title>
<style>
:root {
    --wa-header: #075e54;
    --wa-header-dark: #054740;
    --wa-message-bg: #ece5dd;
    --wa-self: #dcf8c6;
    --wa-other: #ffffff;
    --wa-app-bg: #d1d7db;
    --wa-muted: #667781;
    --wa-border: #d9dee3;
    --wa-send: #00a884;
}

* {
    box-sizing: border-box;
}

html,
body {
    height: 100%;
}

body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(180deg, #0b141a 0 120px, var(--wa-app-bg) 120px 100%);
    display: flex;
    justify-content: center;
    align-items: stretch;
    padding: 20px;
}

.chat-app {
    width: min(980px, 100%);
    background: #f0f2f5;
    border-radius: 10px;
    box-shadow: 0 6px 30px rgba(0, 0, 0, 0.25);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: calc(100dvh - 40px);
}

.chat-header {
    background: var(--wa-header);
    color: #ffffff;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
}

.chat-header-main {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.chat-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 0.9rem;
    flex-shrink: 0;
}

.chat-title {
    margin: 0;
    font-size: 1rem;
    line-height: 1.2;
}

.session-info {
    margin: 2px 0 0;
    color: rgba(255, 255, 255, 0.9);
    font-size: 0.8rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 420px;
}

.online-count-btn {
    border: 1px solid rgba(255, 255, 255, 0.45);
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 0.83rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
}

.online-count-btn:hover {
    background: rgba(255, 255, 255, 0.24);
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background-color: var(--wa-message-bg);
    background-image:
        radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
        radial-gradient(rgba(255, 255, 255, 0.35) 1px, transparent 1px);
    background-size: 24px 24px, 24px 24px;
    background-position: 0 0, 12px 12px;
    -webkit-overflow-scrolling: touch;
}

.message {
    margin: 6px 0;
    padding: 8px 10px;
    border-radius: 8px;
    max-width: min(82%, 560px);
    line-height: 1.35;
    font-size: 0.95rem;
    width: fit-content;
    word-break: break-word;
    box-shadow: 0 1px 0 rgba(11, 20, 26, 0.08);
}

.message.other {
    background: var(--wa-other);
    border-top-left-radius: 2px;
}

.message.self {
    margin-left: auto;
    background: var(--wa-self);
    border-top-right-radius: 2px;
}

.message.notice {
    margin: 10px auto;
    width: fit-content;
    max-width: 90%;
    background: rgba(84, 101, 111, 0.16);
    color: #41525d;
    border-radius: 999px;
    font-size: 0.78rem;
    padding: 6px 12px;
    box-shadow: none;
}

.chat-form {
    display: flex;
    gap: 10px;
    padding: 10px 12px;
    border-top: 1px solid var(--wa-border);
    background: #f0f2f5;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
}

.chat-input {
    flex: 1;
    border: 1px solid #d8dde1;
    border-radius: 24px;
    padding: 10px 14px;
    font-size: 1rem;
    outline: none;
    min-width: 0;
}

.chat-input:focus {
    border-color: var(--wa-send);
}

.send-btn {
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: var(--wa-send);
    color: #ffffff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
}

.send-btn:hover {
    background: #029876;
}

.send-btn:disabled,
.chat-input:disabled {
    opacity: 0.65;
    cursor: not-allowed;
}

.users-modal[hidden] {
    display: none;
}

.users-modal {
    position: fixed;
    inset: 0;
    background: rgba(11, 20, 26, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    z-index: 20;
}

.users-card {
    width: min(420px, 100%);
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    overflow: hidden;
}

.users-card-header {
    background: var(--wa-header-dark);
    color: #ffffff;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.users-title {
    margin: 0;
    font-size: 1rem;
}

.users-close-btn {
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 0.82rem;
}

.users-list {
    margin: 0;
    list-style: none;
    padding: 8px 0;
    max-height: min(60vh, 420px);
    overflow-y: auto;
}

.users-list-item {
    padding: 10px 14px;
    border-bottom: 1px solid #eef1f4;
    color: #1f2c34;
}

.users-list-item:last-child {
    border-bottom: 0;
}

.users-self {
    color: var(--wa-muted);
    font-size: 0.85rem;
    margin-left: 6px;
}

@media (max-width: 760px) {
    body {
        padding: 0;
        background: #0b141a;
    }

    .chat-app {
        min-height: 100dvh;
        border-radius: 0;
        width: 100%;
    }

    .chat-header {
        padding-top: calc(10px + env(safe-area-inset-top));
    }

    .session-info {
        max-width: 190px;
    }

    .message {
        max-width: 90%;
    }
}
</style>
</head>
<body>
<div class="chat-app">
    <header class="chat-header">
        <div class="chat-header-main">
            <div class="chat-avatar">LC</div>
            <div>
                <h1 class="chat-title">Live Chat</h1>
                <p id="sessionInfo" class="session-info">Connecting...</p>
            </div>
        </div>
        <button id="onlineCount" class="online-count-btn" type="button" aria-haspopup="dialog" aria-controls="usersModal">
            0 users online
        </button>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <form id="chatForm" class="chat-form" autocomplete="off">
        <input id="messageInput" class="chat-input" type="text" placeholder="Type a message" maxlength="500" disabled>
        <button id="sendBtn" class="send-btn" type="submit" disabled aria-label="Send message">&#10148;</button>
    </form>
</div>

<div id="usersModal" class="users-modal" hidden>
    <div class="users-card" role="dialog" aria-modal="true" aria-labelledby="usersModalTitle">
        <div class="users-card-header">
            <h2 id="usersModalTitle" class="users-title">Online Users</h2>
            <button id="closeUsersModal" class="users-close-btn" type="button">Close</button>
        </div>
        <ul id="usersList" class="users-list"></ul>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/script.js"></script>
</body>
</html>
